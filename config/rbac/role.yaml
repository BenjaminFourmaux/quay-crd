---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - quay.io
  resources:
  - organizations
  - quayconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - quay.io
  resources:
  - organizations/finalizers
  - quayconfigs/finalizers
  verbs:
  - update
- apiGroups:
  - quay.io
  resources:
  - organizations/status
  - quayconfigs/status
  verbs:
  - get
  - patch
  - update
