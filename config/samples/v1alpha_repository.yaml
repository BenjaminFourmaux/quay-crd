apiVersion: quay.io/v1alpha
kind: Repository
metadata:
  labels:
    app.kubernetes.io/name: quay-crd
    app.kubernetes.io/managed-by: kustomize
  name: repository-sample
spec:
  name: organization-sample/repository-sample
  visibility: private
  mirroring:
    registryLocation: "docker.io/traefik"
    tags:
      - v3.7.17
    syncInterval: 2m
    robotUser: "organization-sample+gpt"
    credentials:
      usernameFrom:
        secretKeyRef:
          name: registry-credentials
          key: username
      passwordFrom:
        secretKeyRef:
          name: registry-credentials
          key: password
    verifyTLS: true
    acceptUnsignedImages: true
